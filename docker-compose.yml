services:
  db:
    image: postgres:17-alpine
    container_name: document-search-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: document-search-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  init:
    build: .
    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ELASTICSEARCH_URL: http://elasticsearch:9200

    command:
      - sh
      - -c
      - python -m scripts.init_db && python -m scripts.import_data && python -m scripts.index_documents

    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    restart: "no"

  api:
    build: .
    container_name: docsearch-api

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ELASTICSEARCH_URL: http://elasticsearch:9200

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  elasticsearch_data:
